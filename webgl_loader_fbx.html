<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js webgl - FBX loader</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body { margin: 0; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            display: block;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #info a {
            color: #fff;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - FBXLoader<br />
        Character and animation from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo</a>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "./build/three.module.js",
                "three/examples/jsm/": "./examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import Stats from 'three/examples/jsm/libs/stats.module.js';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
        import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
        import { GUI } from 'three/examples/jsm/libs/lil-gui.module.min.js';

        let camera, scene, renderer, stats, mixer, object;
        const clock = new THREE.Clock();

        const manager = new THREE.LoadingManager();
        const params = { asset: 'Samba Dancing' }; // Nombre del archivo en tu carpeta
        const assets = ['Samba Dancing', 'morph_test'];

        init();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(50, 50, 50); // Posición de la cámara

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xa0a0a0);
            scene.fog = new THREE.Fog(0xa0a0a0, 200, 1000);

            // Lights
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 10);
            hemiLight.position.set(0, 200, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 10);
            dirLight.position.set(0, 200, 100);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Ground
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshPhongMaterial({ color: 0x999999, depthWrite: false }));
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const grid = new THREE.GridHelper(2000, 20, 0x000000, 0x000000);
            grid.material.opacity = 0.2;
            grid.material.transparent = true;
            scene.add(grid);

            // Load FBX model
            const loader = new FBXLoader(manager);
            loadAsset(params.asset, loader);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Camera controls
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 50, 0); // Apunta a la altura del modelo
            controls.update();

            window.addEventListener('resize', onWindowResize);

            // Stats
            stats = new Stats();
            container.appendChild(stats.dom);

            // GUI
            const gui = new GUI();
            gui.add(params, 'asset', assets).onChange(value => {
                loadAsset(value, loader);
            });
        }

        function loadAsset(asset, loader) {
            console.log('Intentando cargar el modelo:', `examples/models/fbx/${asset}.fbx`);
            loader.load(`examples/models/fbx/${asset}.fbx`, group => {
                console.log('Modelo cargado exitosamente:', group);

                if (object) {
                    scene.remove(object);
                }
                object = group;

                // Check for animations
                console.log('Animaciones disponibles:', object.animations);
                if (object.animations.length) {
                    mixer = new THREE.AnimationMixer(object);
                    const action = mixer.clipAction(object.animations[0]);
                    action.play();
                }

                // Enable shadows and adjust material for visibility
                object.traverse(child => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                // Adjust scale and position
                object.scale.set(1, 1, 1); // Reduce la escala a un valor más razonable
                object.position.set(0, 50, 0); // Eleva el modelo por encima del suelo
                console.log('Escala del modelo:', object.scale);
                console.log('Posición del modelo:', object.position);

                // Calculate bounding box to debug size
                const box = new THREE.Box3().setFromObject(object);
                console.log('Tamaño del modelo (bounding box):', box);

                scene.add(object);
                console.log('Modelo añadido a la escena');

            }, undefined, error => {
                console.error('Error al cargar el modelo FBX:', error);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
            stats.update();
        }

        animate();
    </script>
</body>
</html>
